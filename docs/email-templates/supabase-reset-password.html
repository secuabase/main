<!-- Supabase → Authentication → Email templates → Reset Password. Subject: Reset your Secuabase password -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F4F5F8;padding:32px 16px;font-family:Poppins,Arial,sans-serif;color:#1B207C;">
  <tr><td align="center">
    <table width="520" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:24px;border:1px solid #E1E2EA;padding:40px;">
      <tr><td style="padding-bottom:24px;">
        <table cellpadding="0" cellspacing="0"><tr>
          <td style="width:36px;height:20px;background:#2634B9;border-radius:10px;"></td>
          <td style="width:8px;"></td>
          <td style="font-weight:700;font-size:17px;color:#1B207C;">secuabase</td>
        </tr></table>
      </td></tr>
      <tr><td style="font-size:28px;font-weight:600;line-height:36px;padding-bottom:12px;">Set a new password</td></tr>
      <tr><td style="font-size:15px;line-height:24px;color:#50548F;padding-bottom:24px;">
        Click the button to choose a new password. The link works for 15 minutes, one time only.
      </td></tr>
      <tr><td style="padding-bottom:24px;">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password" style="display:inline-block;background:#2634B9;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:500;padding:14px 28px;border-radius:9999px;">Set new password</a>
      </td></tr>
      <tr><td style="font-size:13px;line-height:20px;color:#50548F;">
        Did not ask for this? Ignore this email. Your password stays the same.
      </td></tr>
    </table>
  </td></tr>
</table>
